.</p>\n<h3>💒 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Romantic</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Choose a romance-focused aspiration</p><p><strong>Home:</strong> Tartosa</p><p><strong>Relationship rule:</strong> Date at least 3 Sims before choosing a permanent partner</p><p>Randomize favorite color and décor style. Those results can influence the heir's personal home, but the eventual wedding should reflect the couple rather than only the Dynasty.</p></div>\n<h3>Date Before Settling</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Date at least three Sims and allow at least one relationship to end before final commitment.</span></label>\n<h3>Build the Relationship</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Become Good Friends with the eventual spouse, travel together, and integrate each other into friend/family circles.</span></label>\n<h3>Wedding Journey</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Hold a proposal, choose wedding roles, plan at least one pre-wedding event, select cake/flowers/outfits/venue, and host a full ceremony.</span></label>\n<h3>Honeymoon</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Take a real honeymoon afterward and preserve wedding photographs.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>If practical, marry a Noble, another Dynasty member, or an ordinary Sim whose status creates interesting reactions. Do not force a relationship that your Sim does not want.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If marrying into another Dynasty, decide whether the spouse stays in their original Dynasty, joins yours, or creates a branch - but the main playable line must preserve the original Dynasty.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Make this the grandest formal Dynasty event so far: use family colors, crest, formal dress, allied households, and a formal portrait.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who becomes fascinated by howling, Moonwood Mill, or supernatural rebellion rather than fairy-tale romance.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>At least 3 dating experiences.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Strong friendship/romance established with final spouse.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Pre-wedding and wedding events completed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Honeymoon completed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Royal/Dynasty wedding portrait preserved.</span></label>"},"23":{"pack":"Werewolves","html":"<div class=\"pill\">The Scandalous Heir</div>\n<p>Immediately after the family&#x27;s most polished wedding generation, the next heir becomes the kind of scandal aristocratic relatives whisper about: a Werewolf.</p>\n<h3>🐺 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Occult status:</strong> Start Human</p><p><strong>Traits:</strong> Randomize traits not inherited from Generation 22</p><p><strong>Aspiration:</strong> Werewolf Initiate, then an advanced Werewolf aspiration</p><p><strong>Home:</strong> Moonwood Mill</p><p><strong>Succession risk:</strong> This protagonist can genuinely lose their place as heir</p><p>Randomize favorite color and décor style. Become a Werewolf through gameplay and accept the consequences for the Dynasty.</p></div>\n<h3>Transformation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Become a Werewolf through gameplay and complete Werewolf Initiate.</span></label>\n<h3>Pack Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Learn lore, join either the Moonwood Collective or Wildfangs, and advance within the chosen group.</span></label>\n<h3>Werewolf Systems</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience Fury and Rampages, unlock abilities, accept Temperaments, explore tunnels, and meet Greg.</span></label>\n<h3>Final Path</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose and complete an advanced Werewolf aspiration based on how the Sim actually develops.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Treat repeated public Rampages and value violations as a possible Dynasty scandal.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If the heir seriously damages family standing, the current Head may declare them Outcast.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>An Outcast heir must complete their Werewolf arc, gain greater control, and repair the relationship with the Head to reclaim succession - or lose the Heir title to a sibling.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>This is the first generation where your planned protagonist is allowed to permanently lose succession.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>If the original heir loses succession, the sibling who replaces them becomes the parent/guardian of the Gen 24 line.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise the next Teen determined to seem normal and worthy in a family obsessed with succession.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Werewolf Initiate and advanced aspiration complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Pack membership and lore explored.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Greg encountered.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Outcast/succession story resolved one way or the other.</span></label>"},"24":{"pack":"High School Years","html":"<div class=\"pill\">The Spare Becomes the Heir</div>\n<p>This generation begins before adulthood. After the previous scandal, the Dynasty refuses to decide succession on birth order alone. The teenagers have to prove who should inherit.</p>\n<h3>🎒 Starting Your Heir's Teen Years</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Teen</p><p><strong>Traits:</strong> Keep inherited traits and randomize anything not required</p><p><strong>School:</strong> Attend Copperdale High School actively</p><p><strong>Home:</strong> Copperdale</p><p><strong>Major milestone:</strong> Prom and natural graduation</p><p><strong>Succession rule:</strong> The heir may be chosen by the post-Prom Heir Score</p><p>Randomize favorite color and décor style when appropriate. Unlike most generations, this chapter begins before Young Adulthood because the teenage story determines succession.</p></div>\n<h3>School Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Attend classes, use lockers, take exams, meet teachers, and participate in active school days.</span></label>\n<h3>Teen Identity</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Join an after-school activity, use Social Bunny, visit ThrifTea, create/use Trendi outfits, hang out at the pier, and experience teen drama.</span></label>\n<h3>Romance &amp; Prom</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one teen crush or romance and attend Prom.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The teen romance does not have to become the eventual spouse.</span></label>\n<h3>Graduation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not age the heir up early simply to advance. Finish high school and attend graduation when possible.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>After Prom, score all eligible teens: +1 excellent grades; +1 positive relationship with Dynasty Head; +1 follows Dynasty Values; +1 successful extracurricular participation; +1 positive Character Value or major positive milestone.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Highest score becomes Heir. If tied, randomize.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not protect the intended protagonist if another teen legitimately wins.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The selected heir eventually starts a family.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Their child becomes the focus of Growing Together, where family compatibility and dynamics matter more than perfect parenting.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Active high school life experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>After-school activity participated in.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Social Bunny/ThrifTea/Trendi used.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Prom and graduation experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty Heir chosen through the scoring system.</span></label>"},"25":{"pack":"Growing Together","html":"<div class=\"pill\">The Dynasty Fractures</div>\n<p>By now the family tree is enormous. The next Head discovers that being related does not mean being compatible. This generation embraces milestones, family dynamics, extended relatives, and the first formal split in the Dynasty.</p>\n<h3>👨‍👩‍👧‍👦 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize traits not established during Generation 24 and accept discovered trait changes</p><p><strong>Home:</strong> San Sequoia</p><p><strong>Family goal:</strong> At least 2 children</p><p><strong>Primary focus:</strong> Compatibility, Family Dynamics, milestones, Stay Overs, and extended family</p><p><strong>Dynasty twist:</strong> A sibling, cousin, or child will establish a cadet branch</p><p>Randomize favorite color and décor style. Do not reroll inconvenient compatibility or personality discoveries simply to make the family easier.</p></div>\n<h3>Personality &amp; Compatibility</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Allow gameplay to shape personality. Accept at least one trait discovery/change.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Maintain at least one relationship with excellent compatibility and one difficult relationship.</span></label>\n<h3>Children &amp; Milestones</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least two children and experience infant/child milestones without cheating them.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Allow different Family Dynamics to develop with different relatives.</span></label>\n<h3>Extended Family</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Maintain grandparents, siblings, cousins, or other relatives; host a Stay Over and hold family gatherings.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore San Sequoia community/recreation spaces.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Move relatives into separate households while keeping them in the Dynasty when appropriate.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose one ambitious sibling/cousin to leave and establish a cadet/branch Dynasty.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Decide whether the new branch is allied, neutral, or rival based on relationships and story.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>This branch should continue existing for at least several generations if story progression allows.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>One child becomes fascinated with horses, ranches, competition, or open land and is prepared as Gen 26 heir.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>At least one trait discovery accepted.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Contrasting compatibility relationships experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least two children with distinct family dynamics.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Stay Over and extended-family gathering complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Cadet Dynasty established.</span></label>"},"26":{"pack":"Horse Ranch","html":"<div class=\"pill\">The Country Aristocracy</div>\n<p>The Dynasty now has urban estates, rural roots, and a cadet branch. This heir adds a prestigious ranch, championship horses, and a cellar of valuable Nectar to the family holdings.</p>\n<h3>🐎 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Horse Lover</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Championship Rider</p><p><strong>Home:</strong> Chestnut Ridge</p><p><strong>Secondary skill:</strong> Nectar Making</p><p>Randomize favorite color and décor style. Your first horse does not need perfect traits—the bond and training are part of the generation.</p></div>\n<h3>Horse Bond</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Acquire a horse, keep it rather than constantly rerolling for perfection, bond deeply, and train it.</span></label>\n<h3>Competition</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Build horse abilities, enter competitions, and work toward championship success.</span></label>\n<h3>Ranch Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise Mini Goats and/or Mini Sheep, host Ranch Gatherings, and participate in Chestnut Ridge culture.</span></label>\n<h3>Nectar</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Develop Nectar Making, create several varieties, age valuable bottles, and earn meaningful income through Nectar.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Save at least one high-value aged bottle forever.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Treat the ranch as Dynasty Estate #2.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Host at least one formal Dynasty gathering at the ranch.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Display the saved Nectar bottle or championship memorabilia as a permanent heirloom.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who notices that land and buildings generate wealth and becomes interested in property ownership.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Championship Rider complete or major championship achieved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Strong horse bond and training complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Mini livestock/ranch gathering experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Nectar Making developed and valuable bottle preserved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Formal Dynasty ranch event held.</span></label>"},"27":{"pack":"For Rent","html":"<div class=\"pill\">The Dynasty Landlord</div>\n<p>The ranch heir sees land as more than heritage. They turn property into income, forcing the Dynasty to confront what kind of landlord it wants to be.</p>\n<h3>🏘️ Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize traits not inherited from Generation 26</p><p><strong>Home:</strong> Tomarang</p><p><strong>Primary livelihood:</strong> Residential Rental ownership</p><p><strong>Starting property:</strong> Begin with a modest rental rather than a giant complex</p><p><strong>Philosophy:</strong> Eventually choose Benevolent or Profit-Driven landlord</p><p>Randomize favorite color and décor style. Use them in the heir's own unit or the shared spaces rather than redesigning solely for maximum rent.</p></div>\n<h3>Tomarang Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore Tomarang, visit the Night Market, try local foods, and build community relationships.</span></label>\n<h3>Build the Rental</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create or acquire a Residential Rental and begin with only a few units.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Select tenants, collect rent, and maintain the property.</span></label>\n<h3>Landlord Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Respond to maintenance and tenant problems, interact with tenants personally, and improve/expand only as success grows.</span></label>\n<h3>Choose a Philosophy</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Pick either Benevolent Dynasty - affordable/well-maintained housing - or Profit Dynasty - premium/luxury housing.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Follow that philosophy consistently.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Treat rentals as part of the Dynasty property portfolio.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>A serious tenant dispute or business conflict may create a new rival household or deepen the existing Dynasty rivalry.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not let inherited wealth erase the need to manage the property actively.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a financially comfortable heir who has everything except a stable love life.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Tomarang community life experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Residential Rental operating successfully.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Tenant events/maintenance handled.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Property improved/expanded.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Landlord philosophy chosen and followed.</span></label>"},"28":{"pack":"Lovestruck","html":"<div class=\"pill\">The Forbidden Romance</div>\n<p>The heir grows up with status, property, and centuries of expectations. Love is the one area where the Dynasty cannot guarantee success.</p>\n<h3>💘 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Romantic</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Career:</strong> Romance Consultant</p><p><strong>Home:</strong> Ciudad Enamorada</p><p><strong>Relationship rule:</strong> At least one serious relationship must fail before the final partner</p><p>Randomize favorite color and décor style. Use Cupid's Corner and the attraction systems instead of creating a perfectly compatible spouse in CAS.</p></div>\n<h3>Dating Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create/use Cupid&#x27;s Corner and date multiple Sims.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Pay attention to attraction, turn-ons/turn-offs, and relationship satisfaction rather than choosing only by appearance.</span></label>\n<h3>Heartbreak</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience at least one failed serious relationship without reloading.</span></label>\n<h3>Romance Consultant</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Progress substantially through the career while giving other Sims romantic guidance.</span></label>\n<h3>Find the One</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Only settle down after developing genuinely strong romantic satisfaction with a partner.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>When the serious partner appears, roll 1-6: 1-2 family approves; 3-4 considered unsuitable; 5 connected to a rival Dynasty; 6 already entangled in a complicated relationship.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If disapproved, choose Duty or Love. Accept Prestige/Unity/scandal consequences.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not save-reload away a forbidden-romance scandal.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who becomes preoccupied with mortality, ghosts, funerals, and what a legacy means after death.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Cupid&#x27;s Corner and attraction systems used.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least one serious relationship fails.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Romance Consultant career substantially progressed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Final relationship has strong satisfaction.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Duty-versus-love Dynasty decision played through.</span></label>"},"29":{"pack":"Life & Death","html":"<div class=\"pill\">The Succession Crisis</div>\n<p>The next heir has spent a lifetime watching a family obsessed with legacy. They decide to understand the one force no Dynasty can fully control: death.</p>\n<h3>⚰️ Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize traits not inherited from Generation 28</p><p><strong>Home:</strong> Ravenwood</p><p><strong>Career:</strong> Randomly choose the Reaper or Undertaker route where available</p><p><strong>Primary skill/focus:</strong> Thanatology, funerals, ghosts, wills, Bucket List, and Soul's Journey</p><p><strong>Succession setup:</strong> Choose an official Heir and an unofficial Spare</p><p>Randomize favorite color and décor style. This generation must accept important natural deaths without reloading them away.</p></div>\n<h3>Professional Death</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Work through the chosen career and develop Thanatology.</span></label>\n<h3>Ravenwood &amp; Ghosts</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore Ravenwood, befriend ghosts, and engage deeply with supernatural death-related gameplay.</span></label>\n<h3>Funerals &amp; Remembrance</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Attend funerals when possible and hold meaningful memorials for important relatives.</span></label>\n<h3>Will &amp; Soul&#x27;s Journey</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create a will, decide what happens to important property/heirlooms, and pursue the Sim&#x27;s life goals/Soul&#x27;s Journey.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Formally designate the Dynasty Heir before death and identify a second Sim as the unofficial spare.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>When the Head dies, roll 1-6: 1-4 smooth succession; 5 another relative challenges the new Head; 6 a major family feud begins.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not undo the Head&#x27;s death. Play the resulting power struggle.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The successor or their child becomes Gen 30, determined to modernize a family that risks becoming trapped by its own history.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Chosen career substantially or fully progressed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Thanatology developed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Ghost/funeral/will systems experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Soul&#x27;s Journey/Bucket List meaningfully pursued.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Natural death accepted.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Succession roll resolved.</span></label>"},"30":{"pack":"Businesses & Hobbies","html":"<div class=\"pill\">Modernizing the Dynasty</div>\n<p>Thirty generations of tradition can become a burden. This heir proves the family can still create something new by building a small business around a genuine craft.</p>\n<h3>🏺 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize traits not inherited from Generation 29</p><p><strong>Home:</strong> Nordhaven</p><p><strong>Primary craft:</strong> Choose Pottery or Tattooing; you may eventually learn both</p><p><strong>Primary livelihood:</strong> A genuine Small Business built around the chosen craft</p><p><strong>Lifetime business goal:</strong> §50,000</p><p>Randomize favorite color and décor style. Use the Dynasty crest, history, or family colors in the business without making inherited wealth the source of its success.</p></div>\n<h3>Develop the Craft</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Master or highly develop the primary hobby skill and create high-quality work.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Display some of the best work rather than selling everything.</span></label>\n<h3>Build the Business</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create a named, themed Small Business with appropriate activities and customer experience.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Interact with customers and build relationships with regulars.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Improve the business gradually as earnings grow.</span></label>\n<h3>Profit Goal</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn at least §50,000 through the Small Business over the Sim&#x27;s lifetime.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Incorporate the Dynasty crest, colors, photographs, or heirlooms into the business.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Replace one ancient Dynasty Value with a modern value representing craft, entrepreneurship, creativity, or community.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose one heirloom from an older generation to display publicly in the business.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise an heir who feels suffocated by the family&#x27;s wealth and history and becomes drawn back toward nature.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Primary hobby mastered/highly developed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Small Business established and improved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>§50,000 business earnings.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Historic Dynasty object displayed in the business.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>One Dynasty Value modernized.</span></label>"},"31":{"pack":"Enchanted by Nature","html":"<div class=\"pill\">The Keeper of the Legacy</div>\n<p>The thirty-first heir carries generations of history but feels the same pull toward nature that started everything. They leave most family wealth behind, move to Innisgreen, and reconnect the Dynasty with its oldest roots - now with Fairies and supernatural nature in the mix.</p>\n<h3>🧚 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize all non-required traits</p><p><strong>Favorite color &amp; décor:</strong> Randomize both</p><p><strong>Starting money:</strong> No more than §10,000</p><p><strong>Home:</strong> Innisgreen</p><p><strong>Primary focus:</strong> Nature, Apothecary, ailments, Fairies, and returning to the Dynasty's roots</p><p>Leave most of the family fortune behind. This heir should feel closer to Generation 1 than to the aristocratic generations in between.</p></div>\n<h3>Natural Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore Innisgreen thoroughly, spend substantial time outdoors, and build a life centered on nature.</span></label>\n<h3>Apothecary &amp; Ailments</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore Apothecary gameplay, gather ingredients when practical, make remedies, and experience ailment systems without cheating them away.</span></label>\n<h3>Fairies</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Meet Fairies, build relationships, and learn the supernatural systems.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>When becoming a Fairy is an option, roll 1-2 remain human; 3-6 become a Fairy. If rolled, transform legitimately and actually use Fairy abilities.</span></label>\n<h3>Natural Home</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Build gradually and incorporate the Sim&#x27;s randomized favorite color/decor style into a nature-heavy home.</span></label>\n<h3>Return to the Beginning</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Before Elder, travel to Granite Falls, find the Deep Woods and Hermit, and camp for at least 3 nights.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Bring the oldest surviving Generation 1 heirloom and the Dynasty crest if possible.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Take the Generation 31 Head portrait and place it with the others, but leave room for one final portrait.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Bring the current Dynasty Head on the Granite Falls pilgrimage and treat it as a return to the family&#x27;s oldest roots before the final generation.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Before moving to Generation 32, review the Dynasty history and identify any unfinished global goals: maximum Prestige, an alliance, a rivalry, a scandal, an Outcast story, a branch Dynasty, preservation of the original crest, and Nobility in the main line.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The main Dynasty must not have been dissolved between Generations 1 and 32.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The designated heir continues into Generation 32: Adventure Awaits.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Before succession, let the Gen 31 Head decide whether the next heir inherits the family&#x27;s formal traditions or is encouraged to create a more playful, adventurous version of them.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Major Enchanted by Nature systems explored.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Apothecary/ailments experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Fairy decision rolled and honored.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Natural livelihood established.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Granite Falls pilgrimage completed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Generation 31 Head portrait placed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty history reviewed and unfinished finale goals identified for Generation 32.</span></label>\n<h2>Challenge Finale</h2>\n<p>When Generation 32 completes the final Dynasty Getaway, visit the ancestral portrait gallery and Dynasty Collection. The challenge is finished when the same family line that began with a broke wilderness founder has survived thirty-two generations of careers, businesses, occults, travel, family conflict, nobility, scandals, reforms, romances, deaths, and reinvention without dissolving the original Dynasty.</p>\n<div class=\"pill\">From humble roots, we rise.</div>\n<p>Share, remix, and adapt this fan-made challenge for your own save. Credit is appreciated when reposting edited versions.</p>"},"32":{"pack":"Adventure Awaits","html":"<div class=\"pill\">The Great Legacy Getaway</div>\n<p>The family has survived wilderness, careers, fame, magic, scandal, nobility, death, reinvention, and thirty-one generations of change. The final heir decides the Dynasty should not end as a museum piece. They create a place where descendants can keep making memories. Generation 32 is about adventure, play, childhood, and turning the family legacy into a tradition that can continue long after the challenge ends.</p>\n<h3>🏕️ Starting Your Final Generation</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult unless succession has naturally produced another appropriate starting age</p><p><strong>Trait:</strong> Use Competitive if it fits; otherwise randomize non-required traits</p><p><strong>Favorite color &amp; décor:</strong> Randomize any results not already established</p><p><strong>Starting money:</strong> No more than §20,000 for the personal household</p><p><strong>Home:</strong> Move to Gibbi Point or make it the primary home-away-from-home</p><p><strong>Protected property:</strong> The ancestral estate, portrait gallery, crest, and heirlooms remain intact</p><p>This is the final published generation, but it should feel like the beginning of a new family tradition rather than the end of the bloodline.</p></div>\n<h3>🏕️ Establish Your Base</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Move the heir to Gibbi Point or establish it as the generation's primary home-away-from-home.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use the Competitive trait if it fits the heir; otherwise randomize traits that are not required by prior succession rules.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Take no more than §20,000 from the Dynasty for the heir's personal household. The ancestral estate and heirlooms remain intact.</span></label>\n<h3>Explore Gibbi Point</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit all three Gibbi Point neighborhoods: Wanderwood Wilds, Crystal Valley, and Jellyfish Junction.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience the major natural sights and local activities, including the geyser area, glowing nighttime scenery, fishing or river activities, and the boardwalk.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Complete at least one local quest and learn something about Gibbi Point's unusual wildlife or mysteries.</span></label>\n<h3>The Getaway System</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Attend at least three different Getaways. At least one must be family-focused, one active/adventurous, and one chosen purely for the heir's personality.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Create at least one Custom Venue from scratch and use Custom Venue Rules rather than leaving it as a generic destination.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Plan and successfully complete a multi-day Custom Getaway using the Getaway Planner.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Schedule at least one recurring Getaway so the Dynasty gains a tradition that can continue after Generation 32.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Try one competition or elimination-style Getaway. Accept the result without reloading if your heir loses.</span></label>\n<h3>Adventure Skills &amp; Activities</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Use Archery repeatedly and make it one of the generation's signature activities.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Go kayaking and use at least one of the pack's water or diving activities.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Try Entomology or butterfly-catching gameplay.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use Papercraft at least once and display one finished piece in the family home or getaway venue.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use a Modular Playground and at least one waterslide, diving board, Spin Bike, or Free Weight activity.</span></label>\n<h3>Career</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Join the Park Worker career and choose either the Camp Counselor or Park Ranger branch.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach the top of the chosen Park Worker branch before the heir becomes an Elder.</span></label>\n<h3>Childhood Legacy</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise or closely mentor at least one Child Sim during this generation so the expanded childhood systems are central to the story.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have that child experience multiple Formative Moments and allow their Childhood Sentiments to develop naturally.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Complete or make substantial progress on the Cool Kid on the Block child aspiration with at least one child.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Give a child an Imaginary Friend and build a meaningful relationship with it. Accept the personality you choose or randomize it; do not replace it just because it is inconvenient.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Play Hide-and-Seek and Rock, Paper, Scissors with family or friends.</span></label>\n<h3>The Dynasty's Final Venue</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create a permanent Dynasty Getaway venue inspired by the full 32-generation history.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Include at least five references to earlier generations, such as a campfire for Gen 1, photographs for Gen 2, a wellness space for Gen 3, a restaurant/cooking area, magical or occult memorabilia, ranch décor, a noble crest, or other surviving heirlooms.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Display the original Dynasty crest prominently and bring at least one designated heirloom from the ancestral estate.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Host one final multi-household Dynasty Getaway with relatives from as many surviving branches as practical.</span></label>\n<h3>Royalty &amp; Legacy Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The current Dynasty Head must formally designate the future heir even though the published challenge ends here. The family story is meant to continue beyond the rules.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Take the Generation 32 Head portrait and add it to the ancestral portrait gallery.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If any major Dynasty finale requirement is still unfinished, use this generation to resolve it naturally: reach maximum Prestige, maintain an Alliance, experience a Rivalry and genuine Scandal, create and resolve an Outcast story, establish a branch Dynasty, preserve the original crest, and maintain Nobility somewhere in the main line.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The original Dynasty founded in Generation 1 must still exist at the end of Generation 32.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>All three Gibbi Point neighborhoods visited.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Three different Getaways experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Custom Venue built and Custom Getaway completed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>A recurring Dynasty Getaway scheduled.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Adventure activities including Archery and water-based gameplay used.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Park Worker career branch completed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Expanded childhood gameplay and an Imaginary Friend experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Final Dynasty Getaway venue completed with five or more legacy references.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Final multi-household Dynasty Getaway held.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Generation 32 portrait placed and future heir designated.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>All global Dynasty finale requirements complete.</span></label>\n<h2>Challenge Finale</h2>\n<p>The challenge is complete when the Dynasty that began with one broke wilderness founder has survived thirty-two generations without dissolving, preserved its history, adapted its values, and created a recurring family Getaway for descendants who come next. The final scene should not feel like the family's story is over: gather the Dynasty at its new legacy venue, take one last group picture, and let the next heir begin making memories of their own.</p>"}};
const params=new URLSearchParams(location.search); let g=parseInt(params.get('g')||'1',10);
const TOTAL_GENERATIONS=Math.max(...Object.keys(DATA).map(Number));
if(!DATA[g])g=1; const d=DATA[g];
document.title=`Generation ${g} — ${d.pack} | Every Pack Dynasty Legacy`;
document.getElementById('genLabel').textContent=`Generation ${g} of ${TOTAL_GENERATIONS}`;
document.getElementById('title').textContent=d.pack;
let guide=d.html;
guide=guide.replaceAll('<h3>Dynasty Integration</h3>','<h3>👑 Dynasty Legacy</h3>')
           .replaceAll('<h3>The Next Heir</h3>','<h3>🎲 The Next Heir</h3>')
           .replaceAll('<h3>Generation Completion Checklist</h3>','<h3>🏆 Generation Completion</h3>');
document.getElementById('content').innerHTML=guide;
const prev=document.getElementById('prev'),next=document.getElementById('next');
prev.href=`generation.html?g=${Math.max(1,g-1)}&v=11`;
if(g===31){next.href='generation32.html?v=11';}else{next.href=`generation.html?g=${Math.min(TOTAL_GENERATIONS,g+1)}&v=11`;}
if(g===1)prev.style.visibility='hidden';if(g===TOTAL_GENERATIONS)next.style.visibility='hidden';
const key=`dynasty-progress-${g}`;const boxes=[...document.querySelectorAll('.task input')];
const saved=JSON.parse(localStorage.getItem(key)||'[]');
boxes.forEach((b,i)=>{b.checked=!!saved[i];b.addEventListener('change',save)});
function save(){localStorage.setItem(key,JSON.stringify(boxes.map(b=>b.checked)));update()}
function update(){const done=boxes.filter(b=>b.checked).length,total=boxes.length||1,p=Math.round(done/total*100);document.getElementById('progressText').textContent=p+'%';document.getElementById('bar').style.width=p+'%'}
update();
</script></body></html>
