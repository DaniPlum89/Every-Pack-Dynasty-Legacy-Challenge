.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.gen-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.05)}

.roll{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.roll b{display:block;color:var(--accent2);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}.roll span{display:block;margin-top:5px;font-weight:800}

.content-wrap h1{font-size:clamp(2.5rem,6vw,5rem)} .content-wrap h2{font-family:Georgia,serif;font-size:2rem;margin-top:34px}.content-wrap h3{margin-top:34px;color:var(--accent2);font-family:Georgia,serif;font-size:1.45rem}.content-wrap p{font-size:1.03rem}.task{line-height:1.5}.story-note{padding:16px 18px;border-left:4px solid var(--gold);background:#faf7f1;border-radius:0 12px 12px 0;margin:18px 0}.start-card{background:linear-gradient(135deg,rgba(45,166,111,.08),rgba(125,78,216,.07));border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:22px 0}.start-card h3{margin-top:0}

.progressbar{height:12px;background:#e7e2da;border-radius:999px;overflow:hidden}.progressbar>div{height:100%;width:0;background:var(--accent)}

<script>
const DATA={"1":{"pack":"Outdoor Retreat","html":"<div class=\"pill\">The Wilderness Founder</div>\n<p>Your legacy begins with a Sim who has had enough of ordinary life. They dream of escaping civilization, learning to live from the land, and becoming an expert herbalist. Granite Falls is where they discover what they actually want from life.</p>\n<p><em>Outdoor Retreat</em> is a natural starting point because its core gameplay revolves around Granite Falls, camping, wild plants and insects, Herbalism, hiking, fishing, campfires, and discovering the Hermit in the Deep Woods.</p>\n<h3>🌱 Create Your Founder</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Aspiration:</strong> Outdoor Enthusiast</p><p><strong>Required trait:</strong> Loves Outdoors</p><p><strong>Other 2 traits:</strong> Randomize them</p><p>Use your Random Sim Generator to determine their <strong>favorite color and favorite décor style</strong>. Those results become part of the legacy: when you eventually build the founder's permanent home, their bedroom and main living space should reflect them.</p><p><strong>Starting money:</strong> §5,000 after purchasing an empty residential lot.</p><p>You may buy basic camping supplies before leaving, but <strong>don't build a proper house yet.</strong></p></div>\n<h3>🏕️ Your First Adventure</h3>\n<p>As soon as possible, take your founder to <strong>Granite Falls</strong>. Start cheaply. Your Sim is supposed to feel like they're genuinely roughing it rather than taking a luxury vacation.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>Complete the <strong>Outdoor Enthusiast aspiration</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach <strong>Herbalism Level 10</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Identify all <strong>10 wild Outdoor Retreat plants</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Brew every herbal remedy you can discover.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Catch at least <strong>10 different insects</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Catch at least <strong>5 different fish</strong> while in Granite Falls.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Play horseshoes.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Stargaze.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Roast food or marshmallows over a campfire.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Tell a story around a campfire.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Sleep in a tent at least <strong>5 nights</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore Granite Falls State Park.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Find the entrance to the <strong>Deep Woods</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Find and befriend the <strong>Hermit</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Become <strong>Good Friends</strong> with the Hermit.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Learn everything you can from the Hermit.</span></label>\n<div class=\"story-note\"><strong>Gameplay note:</strong> The Hermit is hidden deep within Granite Falls, and Herbalism is the skill your founder uses to identify wild plants and create remedies. If Seasons is installed, some Granite Falls plants may be unavailable during certain seasons, so another trip may be necessary.</div>\n<h3>💰 How Your Founder Makes Money</h3>\n<p>This generation is <strong>not allowed to have a traditional career</strong>. Your Sim has to survive using the wilderness.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn Simoleons through <strong>fishing, gardening, collected insects/plants, crafted herbal remedies, and other items your Sim personally collects or produces</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not use a regular rabbit-hole career, active career, or freelance career during this generation.</span></label>\n<p>This makes Generation 1 function a little like a light rags-to-riches challenge.</p>\n<h3>🏡 Building the Family Home</h3>\n<p>Your founder starts with virtually nothing, but Granite Falls isn't going to be their permanent residence.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn <strong>§10,000 through wilderness activities</strong> before beginning construction of the permanent family home.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span><strong>No buying your way into luxury immediately.</strong> Add rooms and furnishings gradually as your Sim earns money.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Incorporate Outdoor Retreat Build/Buy objects where practical.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use the founder's randomized <strong>favorite décor style and favorite color</strong> to influence the bedroom and main living space.</span></label>\n<h3>❤️ Love &amp; Family</h3>\n<p>Your founder cannot marry someone created in CAS specifically to be their perfect partner. They must meet their partner naturally through gameplay. Dating is unrestricted, and they do not have to marry the first Sim they date.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>Before having or choosing the Generation 2 heir, reach <strong>Herbalism Level 5+</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Before having or choosing the Generation 2 heir, spend at least <strong>5 nights camping</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Before having or choosing the Generation 2 heir, visit the <strong>Deep Woods</strong> and meet the <strong>Hermit</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least <strong>one child</strong>. You may have as many additional children as you like.</span></label>\n<h3>👑 Founding the Dynasty</h3>\n<p>Your founder is not famous, wealthy, or Noble. But once they have established a permanent home, they have built the beginning of something much bigger.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>Once the permanent family home exists, officially <strong>found the Dynasty</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose the Dynasty <strong>name, crest, motto/description, and first Values</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose Values that reflect the founder's actual story—nature, self-reliance, knowledge, family, or another fitting ideal.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve the <strong>original Dynasty crest</strong>. Future generations may evolve the family, but the crest must remain substantially recognizable through Generation 32.</span></label>\n<h3>🏺 The First Dynasty Heirloom</h3>\n<p>Before Generation 1 ends, choose one object connected to the founder's story. It could be a rare plant, collectible, herbal remedy, camping object, photograph, fish, insect, or another meaningful possession.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>Designate one Generation 1 object as the <strong>oldest Dynasty Heirloom</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Never sell the designated heirloom. Eventually display it in the ancestral Dynasty Estate.</span></label>\n<h3>👶 Choosing the Generation 2 Heir</h3>\n<p>The heir grows up hearing endless stories about wilderness adventures—but they want something completely different. They are fascinated by <strong>science, technology, and professional achievement</strong>.</p>\n<label class=\"task\"><input type=\"checkbox\"><span>When the future heir becomes a Teen, give them <strong>Genius, Geek, or Ambitious</strong>. Choose one or randomize between the three.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Before the founder dies or steps down as Dynasty Head, designate the Generation 2 protagonist as the official <strong>Dynasty Heir</strong>.</span></label>\n<div class=\"story-note\"><strong>Important:</strong> The Dynasty is <strong>not Noble yet</strong>. Nobility does not begin until Generation 12: Get Famous, after eleven generations have earned the family's reputation.</div>\n<h3>🏆 Generation 1 Completion</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Complete the <strong>Outdoor Enthusiast aspiration</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach <strong>Herbalism Level 10</strong>.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Complete the Granite Falls exploration, Deep Woods, and Hermit goals.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn at least <strong>§10,000 through wilderness living</strong> before building up the permanent home.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Establish the permanent family home.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Found the Dynasty and create its name, crest, motto, and first Values.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve the first Dynasty Heirloom.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one child and designate the Generation 2 Dynasty Heir.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Give the future heir <strong>Genius, Geek, or Ambitious</strong> as a Teen.</span></label>\n<p>Once those goals are complete, your heir can leave behind tents, insects, and herbal remedies for something completely different:</p>\n<div class=\"story-note\"><strong>Next: 🧪 Generation 2 — Get to Work: The Overachiever</strong><br>Your wilderness founder's child is going from campfires and herbal remedies to laboratories, hospitals, crime scenes, aliens, and professional ambition.</div>"},"2":{"pack":"Get to Work","html":"<div class=\"pill\">The Overachiever</div>\n<p>Your founder&#x27;s child grew up with tents, herbs, and hand-built security. They want the opposite: credentials, promotions, technology, a respected profession, and a family name people recognize.</p>\n<h3>🧪 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Keep the Genius, Geek, or Ambitious trait chosen during Generation 1</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Randomize or choose one that fits the career your Sim rolls</p><p><strong>Career:</strong> Roll 1–3: Doctor, Detective, or Scientist</p><p><strong>Starting money:</strong> No more than §10,000 when moving out</p><p>Randomize their favorite color and favorite décor style. Their first adult home should include both somewhere in the design.</p></div>\n<h3>Active Career Rule</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Roll 1-3 for Doctor, Detective, or Scientist and keep the result.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Join your Sim at work regularly; do not turn the active career into a mostly Send Alone career.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach Level 10 in the rolled profession.</span></label>\n<h3>Doctor Route</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Diagnose and treat many patients, perform surgery, make a house call, deliver a baby, and become friends with a coworker.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Successfully treat at least 20 patients over the generation.</span></label>\n<h3>Detective Route</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit crime scenes, collect and analyze evidence, interview witnesses, issue citations, arrest suspects, and complete at least 5 full cases.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Make at least 10 arrests and befriend a fellow officer.</span></label>\n<h3>Scientist Route</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create inventions, use and upgrade the SimRay, collect scientific specimens, build the Electroflux Wormhole Generator, travel to Sixam, meet an alien, and bring home a Sixam collectible.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If an alien pregnancy occurs naturally through gameplay, keep the child and allow them to be eligible for succession.</span></label>\n<h3>Retail Side Hustle</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Before becoming Elder, own a retail business.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Hire at least one employee, personally interact with customers, restock merchandise, and sell at least one object made by your Sim.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn at least §10,000 in retail profit.</span></label>\n<h3>Photography Legacy</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Take at least five family photographs and display them.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>From this generation forward, take an official portrait of every Dynasty Head.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Replace one Dynasty Value if desired with something reflecting logic, achievement, work, or knowledge.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use professional success and the retail business to build Prestige naturally.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Begin the permanent Dynasty portrait tradition.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not marry until Career Level 5.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one child.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least once during the child&#x27;s upbringing, choose work over a family moment so the next generation has a reason to reject the workaholic lifestyle.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Give the future heir Good, Cheerful, or Loner as a Teen.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Career Level 10.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Career-specific objectives complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Baking 5+ and Photography 5+.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Retail business earned §10,000 profit.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Five family photos displayed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Official Dynasty Head portrait created.</span></label>"},"3":{"pack":"Spa Day","html":"<div class=\"pill\">Finding Balance</div>\n<p>Generation 3 grows up surrounded by work, promotions, and a parent who is rarely off the clock. They decide peace, health, and personal balance matter more than status.</p>\n<h3>🧘 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Keep the Good, Cheerful, or Loner trait selected during Generation 2</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Randomly choose Zen Guru or Self-Care Specialist</p><p><strong>Primary money-making skill:</strong> Wellness</p><p><strong>Starting money:</strong> No more than §5,000</p><p>Randomize their favorite color and favorite décor style. These will later determine the look of the home Wellness studio.</p></div>\n<h3>The Student</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit a spa at least 3 times before becoming an established practitioner.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Receive a massage, attend yoga, meditate, use a sauna, receive a manicure and pedicure, and make at least one friend through spa life.</span></label>\n<h3>The Practitioner</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Once Wellness reaches 3, quit any temporary regular job.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Provide at least 5 massages, 5 manicure/pedicure services, and 5 yoga or meditation teaching sessions.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn the first §1,000 through Wellness-related services.</span></label>\n<h3>The Professional</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach Wellness 10 and complete the chosen Spa Day aspiration.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn at least §10,000 total from Wellness.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Develop at least five repeat clients, defined as Sims who receive services more than once.</span></label>\n<h3>Home Studio</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>After earning §5,000 through Wellness, build a dedicated home wellness space with at least three activity types.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Decorate it around the randomized favorite color and decor style.</span></label>\n<h3>Personal Journey</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Give the Sim a full young-adult makeover including hair, wardrobe, and manicure.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>From Wellness 5 onward, meditate at least three times per Sim week when practical.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use meditation teleportation at least once before adulthood.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>If this heir&#x27;s peaceful path clashes with existing Values, allow Prestige consequences rather than protecting the score.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The new Head may replace one Dynasty Value with Wellness, compassion, balance, or another fitting ideal.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Hold at least one peaceful family gathering intended to repair relationships strained during Generation 2.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The eventual spouse must first become a Good Friend.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Before engagement, go on at least 3 dates, take a trip together, and receive a wellness treatment together.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one child; become Good Friends with the heir, help with homework repeatedly, and never intentionally miss the heir&#x27;s birthday.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Give Generation 4 the Outgoing trait as a Teen and have them make at least 3 friends.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Spa Day aspiration complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Wellness 10.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>§10,000 earned through Wellness.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Home studio complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Five repeat clients established.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Generation 4 prepared with Outgoing and a social circle.</span></label>"},"4":{"pack":"Get Together","html":"<div class=\"pill\">The Social Butterfly</div>\n<p>Your heir loves their peaceful parent, but a quiet wellness household feels suffocating. They want Windenburg, clubs, friends, nightlife, loud music, and a social calendar that never stops.</p>\n<h3>🪩 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Outgoing</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Leader of the Pack</p><p><strong>Primary money-making skill:</strong> DJ Mixing</p><p><strong>Starting money:</strong> No more than §10,000</p><p>Move to Windenburg. Randomize favorite color and décor style and use them in the heir's bedroom, apartment, or club hangout.</p></div>\n<h3>Build the Club</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create a new club with only three starting members including your Sim.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Grow it gradually, unlock useful Club Perks, and establish an official Club Hangout.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Give the club a real identity; choose activities that fit the story rather than only easy point farming.</span></label>\n<h3>Music &amp; Nightlife</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach DJ Mixing 10 and Dancing 5.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>DJ at least five different parties or gatherings and earn some money through DJing.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dance at a nightclub until after midnight and attend a bonfire.</span></label>\n<h3>Windenburg Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit the major Windenburg neighborhoods, cafés, pubs, ancient ruins, and island areas.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Hold at least one gathering at the ruins and swim in Windenburg.</span></label>\n<h3>Social Goals</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Have 10 friends and 3 Good Friends before adulthood.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Throw a house party, dance party, dinner party, and birthday party; earn Gold on at least one.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose another club as a friendly or hostile rival.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>At least half of the final club membership must be non-Dynasty Sims.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Hold one dedicated Dynasty social gathering and take a group photo if possible.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose a rival household/club surname and keep it in your notes; it may become a future Dynasty rival.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Change one Dynasty Value only if this Head&#x27;s social philosophy truly reshapes the family.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Your long-term partner must be someone first encountered through club or nightlife activities.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not marry until Dancing 5, DJ Mixing 7+, a six-member club, and Good Friends status with the partner.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one child and give the future heir Foodie as a Teen.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Leader of the Pack complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>DJ Mixing 10 and Dancing 5.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Successful club with a permanent hangout.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>10 friends and required social events complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty gathering held.</span></label>"},"5":{"pack":"Dine Out","html":"<div class=\"pill\">The Restaurateur</div>\n<p>The parties were fun, but your favorite memories were always the meals. This Sim wants their surname on a restaurant and plans to build it from a modest dining room into a local institution.</p>\n<h3>🍽️ Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Foodie</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Master Chef</p><p><strong>Primary livelihood:</strong> Restaurant ownership</p><p><strong>Starting money:</strong> Use only the heir's reasonable move-out share; do not fund an instant luxury restaurant</p><p>Randomize favorite color and décor style. Work at least one of those results into the restaurant's eventual design.</p></div>\n<h3>Learn the Craft</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Cook at least 15 different dishes.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Eat at other restaurants at least five times as research.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Learn several experimental dishes.</span></label>\n<h3>Open the Restaurant</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Open a modest restaurant, create a menu, uniforms, and a coherent theme.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use the Sim&#x27;s randomized favorite color and decor style somewhere in the restaurant.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Hire and train employees; greet customers, check tables, and personally manage service.</span></label>\n<h3>Build the Business</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn a 5-star rating.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Purchase useful restaurant perks and visibly improve the restaurant over time.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn at least §25,000 in lifetime restaurant profit.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Make the restaurant the first major public institution to carry the Dynasty name or crest.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Display the crest or an heirloom in the restaurant.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use the restaurant&#x27;s success to grow Prestige naturally; the family still is not noble.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Meet the eventual partner through the restaurant or while dining out.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one child and maintain regular family meals despite the business.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Let the future heir spend time around the restaurant but grow up wanting city life instead.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Master Chef complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Cooking 10 and Gourmet Cooking 7+.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>5-star restaurant achieved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>§25,000 restaurant profit.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty branding/heirloom displayed in the restaurant.</span></label>"},"6":{"pack":"City Living","html":"<div class=\"pill\">The City Dreamer</div>\n<p>The heir leaves the family business for a cramped San Myshuno apartment and a life where reputation, networking, festivals, and public careers matter more than the family restaurant.</p>\n<h3>🌆 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required traits:</strong> Randomize unless inherited from the previous heir setup</p><p><strong>Aspiration:</strong> City Native</p><p><strong>Career:</strong> Randomly choose Politician, Critic, or Social Media</p><p><strong>Starting home:</strong> A cheap San Myshuno apartment with inconvenient traits/problems where possible</p><p><strong>Starting money:</strong> Keep the move modest even if the Dynasty is wealthy</p><p>Randomize favorite color and décor style. Do not begin in a penthouse—the city climb is part of the story.</p></div>\n<h3>Apartment Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Live with apartment problems instead of immediately moving away.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Get to know neighbors and deal with noise, broken utilities, pests, or other building issues as they occur.</span></label>\n<h3>Experience the City</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit every district and attend every major festival type at least once.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Participate in festival activities rather than only arriving for the checkmark.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Learn at least 10 San Myshuno food recipes and sing karaoke.</span></label>\n<h3>Career &amp; Climb</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach the top of the randomized City Living career.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Maintain a creative side hustle if desired.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Eventually earn your way into an upscale apartment or penthouse, keeping one meaningful object from the starter apartment.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Host a formal Dynasty gathering in the upgraded apartment/penthouse.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose one non-related household as the first unofficial allied family and try to maintain the relationship for at least three generations.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If Politician is rolled, lean into public influence; if not, let culture/media become the family&#x27;s public face.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Meet the long-term partner in San Myshuno and live together in an apartment before marriage.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The heir must spend childhood in San Myshuno.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Encourage an interest in mystery, old lore, immortality, or nighttime life that leads naturally into Vampires.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>City Native complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Career maxed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>All festival types experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>10 city recipes learned and Singing 5+.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Moved from starter apartment to luxury housing.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>First allied family identified.</span></label>"},"7":{"pack":"Vampires","html":"<div class=\"pill\">The Immortal</div>\n<p>The city heir becomes obsessed with the idea that an accomplished family should not simply disappear with age. They move to Forgotten Hollow as a human and pursue immortality.</p>\n<h3>🧛 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Occult status:</strong> Start Human</p><p><strong>Traits:</strong> Randomize any traits not inherited from Generation 6</p><p><strong>Aspiration:</strong> Randomly choose a Vampire aspiration</p><p><strong>Home:</strong> Forgotten Hollow</p><p><strong>Primary focus:</strong> Vampire Lore and supernatural survival</p><p>Randomize favorite color and décor style. Your Sim must become a Vampire naturally through gameplay rather than starting as one in CAS.</p></div>\n<h3>Become a Vampire</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Meet a Vampire through gameplay, build a relationship, request the turning, and play through the transformation.</span></label>\n<h3>Master the Lore</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach Vampire Lore 15, read vampire texts, grow Plasma Fruit, and create vampire-related food or drink.</span></label>\n<h3>Powers &amp; Weaknesses</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Advance Vampire rank naturally, buy powers, accept meaningful weaknesses, spar or duel, and use powers in normal life.</span></label>\n<h3>Moral Path</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Choose compassionate or predatory based on how the Sim develops, then stay reasonably consistent.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit Vlad and build relationships with other Vampires.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Roll 1-6 when vampirism becomes known: 1-4 accepted, 5 family disgrace, 6 succession conflict.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If rejected, the Sim may temporarily become an Outcast and must earn redemption before taking the Dynasty Head role.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>An immortal Vampire Head must eventually step aside when the next heir is ready; immortality cannot freeze succession forever.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Have at least one child; if both human and Vampire children exist, randomize heir eligibility among them.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The future heir should react to supernatural family drama by craving family stability and hands-on parenting.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Vampire aspiration complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Vampire Lore 15.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>High Vampire rank with meaningful powers/weaknesses.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Pipe Organ developed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Acceptance/Outcast succession story resolved.</span></label>"},"8":{"pack":"Parenthood","html":"<div class=\"pill\">Breaking the Cycle</div>\n<p>After generations of ambition and supernatural drama, this heir wants to prove that the family can be known for how it raises children, not only for what it achieves.</p>\n<h3>👨‍👩‍👧 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Family-Oriented</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Super Parent</p><p><strong>Family goal:</strong> At least 3 children</p><p><strong>Primary skill:</strong> Parenting</p><p>Randomize favorite color and décor style. This generation's home should feel intentionally family-centered rather than built around status.</p></div>\n<h3>Raise the Family</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Help with homework, discipline behavior, encourage positive actions, help with school projects, establish curfews, and participate in everyday family life.</span></label>\n<h3>Character Values</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Aim to raise every child well.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The eventual heir must earn at least three positive Character Value traits.</span></label>\n<h3>Family Traditions</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Share regular family meals, celebrate birthdays, take family photos, and have outings together.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Keep one family portrait permanently displayed.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Make this a Dynasty Unity generation: repair at least two strained family relationships.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Avoid creating new Outcasts unless an extraordinary event makes it narratively appropriate.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Hold a major family reunion.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not automatically choose the firstborn as Heir; wait until Teen years and choose based on Character Values, relationship with the Head, and fit with Dynasty Values.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The next heir should develop a strong bond with animals.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Give them Cat Lover or Dog Lover and allow their childhood relationship with pets/strays to influence the choice.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Super Parent complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Parenting 10.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least 3 children raised.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Heir earns 3 positive Character Value traits.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Two family relationships repaired and a reunion held.</span></label>"},"9":{"pack":"Cats & Dogs","html":"<div class=\"pill\">The Animal Healer</div>\n<p>The selected heir finds it easier to understand animals than people. Brindleton Bay becomes home, and caring for pets turns into a profession.</p>\n<h3>🐾 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Cat Lover or Dog Lover, as selected in Generation 8</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Friend of the Animals</p><p><strong>Primary livelihood:</strong> Veterinary clinic</p><p><strong>Home:</strong> Brindleton Bay</p><p>Randomize favorite color and décor style. Adopt at least one animal through gameplay instead of creating every pet in CAS.</p></div>\n<h3>Pets</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Adopt at least two pets; at least one should be adopted rather than engineered as a perfect CAS pet.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Become companions and reach Pet Training 5.</span></label>\n<h3>Veterinary Career</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Purchase a small clinic, treat animals personally, diagnose illnesses, improve equipment, hire/train staff, and work toward a high clinic rating.</span></label>\n<h3>Brindleton Bay</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore with pets, visit the lighthouse, befriend at least one stray, and build community relationships.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>When a beloved pet dies, create a proper memorial rather than forgetting the urn.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve a clinic-related object, pet memorial, or portrait as this Head&#x27;s Dynasty Heirloom.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If feasible, continue one family pet bloodline for several generations.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Keep the Head portrait tradition.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise an heir who becomes fascinated by relics, maps, old objects, and unexplored places.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The future heir should develop Loves Outdoors or another adventurous trait.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Friend of the Animals complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Pet Training 5.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least two bonded pets.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Successful veterinary clinic.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Stray friendship and lighthouse visit complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty pet/clinic heirloom preserved.</span></label>"},"10":{"pack":"Jungle Adventure","html":"<div class=\"pill\">The Archaeologist</div>\n<p>Comfortable life is not enough. This Sim wants discoveries with their own name attached to them and turns repeated trips to Selvadorada into a career and family legend.</p>\n<h3>🗿 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Loves Outdoors</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Archaeology Scholar</p><p><strong>Primary skill:</strong> Archaeology</p><p><strong>Travel focus:</strong> Repeated Selvadorada expeditions</p><p>Randomize favorite color and décor style. Your permanent home should eventually include a study, museum, or collection room.</p></div>\n<h3>Explore Selvadorada</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Vacation repeatedly rather than attempting one giant trip.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Meet locals, eat local food, dance, learn culture, and stay in different accommodations when practical.</span></label>\n<h3>Archaeology</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach Archaeology 10 and Selvadoradian Culture 5.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Excavate, authenticate artifacts, uncover temples, survive jungle hazards, and discover treasure.</span></label>\n<h3>Private Museum</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Build a study or museum at home.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Display your best artifacts instead of selling everything.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Earn at least §20,000 through archaeology and related treasure.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The archaeological museum becomes the formal Dynasty Collection Room.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Move important older heirlooms into the collection room if the estate can support it.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Never sell designated Dynasty Heirlooms from this point forward.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise an heir who appreciates plants, changing seasons, and a quieter connection to the natural world.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Archaeology Scholar complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Archaeology 10 and Culture 5.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Major temple/jungle exploration complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>§20,000 earned from archaeology/treasure.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty Collection Room established.</span></label>"},"11":{"pack":"Seasons","html":"<div class=\"pill\">A Life for Every Season</div>\n<p>This generation slows the family down. Instead of chasing the next discovery, they build traditions that descendants will still be celebrating many generations later.</p>\n<h3>🍂 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize any traits not inherited from Generation 10</p><p><strong>Aspiration:</strong> Freelance Botanist</p><p><strong>Career:</strong> Gardener</p><p><strong>Primary skill:</strong> Gardening</p><p><strong>Legacy focus:</strong> Seasons, traditions, and the family garden</p><p>Randomize favorite color and décor style. Build the heir's home around year-round family life and gardening rather than instant luxury.</p></div>\n<h3>Garden</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reach Gardening 10, grow plants through multiple seasons, graft, and build a greenhouse.</span></label>\n<h3>Seasonal Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience every season and participate in seasonal activities.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not disable inconvenient weather just to make objectives easier.</span></label>\n<h3>Flower Arranging</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Develop the skill, create arrangements, and sell or gift them.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Keep at least one memorable arrangement or gardening object as an heirloom.</span></label>\n<h3>Family Holidays</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Create at least four custom family holidays to continue in later generations.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>One should be a Dynasty/Crest Day centered on family meals, remembrance, formal clothing, storytelling, or photographs.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The custom holidays become official Dynasty traditions.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Future generations should celebrate them when practical, even when the featured pack is unrelated.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The Dynasty/Crest Day should remain part of the family calendar through Generation 31.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who loves celebrations but increasingly wants to be the center of attention.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Prepare them for Get Famous with an outgoing, dramatic, creative, or self-focused personality.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Freelance Botanist complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Gardening 10.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Greenhouse established.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Full seasonal cycle experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Four custom holidays created, including Dynasty/Crest Day.</span></label>"},"12":{"pack":"Get Famous","html":"<div class=\"pill\">Born for the Spotlight - The Noble Ascension</div>\n<p>After eleven generations of accomplishment, the Dynasty finally produces an heir who wants public recognition on the largest possible scale. Their celebrity rise becomes the family&#x27;s doorway into nobility.</p>\n<h3>🎬 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Self-Absorbed</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Master Actor</p><p><strong>Career:</strong> Actor</p><p><strong>Home:</strong> Start modestly in Del Sol Valley</p><p>Randomize favorite color and décor style. The mansion comes later—this heir has to earn fame before living like a celebrity.</p></div>\n<h3>Acting Career</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Attend auditions and active gigs, build Acting, perform varied productions, and reach the top of the career.</span></label>\n<h3>Fame</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Become a Global Superstar, earn Fame Perks, accept Celebrity Quirks that develop, and experience fans and paparazzi.</span></label>\n<h3>Awards &amp; Estate</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Attend award ceremonies, win at least one award, earn/place a Celebrity Tile, and only then build or buy the major celebrity mansion.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>This is the official Noble Ascension generation. Begin pursuing Nobility through Royalty &amp; Legacy systems.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Transform the celebrity mansion into the first true Dynasty Estate with portrait gallery, crest, formal dining/entertaining space, and heirloom room.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience the family&#x27;s first major public scandal if one arises naturally; do not force a secret-child plot just for a checkbox.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve the acting award or Celebrity Tile as an heirloom.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise the next heir amid fame and public scrutiny.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>The child should grow to hate being watched and choose StrangerVille as a place to disappear.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Master Actor complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Acting career maxed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Global Superstar achieved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least one major award won and Celebrity Tile placed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Noble progression begun.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty Estate established.</span></label>"},"13":{"pack":"StrangerVille","html":"<div class=\"pill\">The Disgraced Noble</div>\n<p>A child of celebrity and nobility flees to the one place they believe nobody will care about the family name. Instead, they find a town hiding a terrifying secret.</p>\n<h3>👽 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Paranoid</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> StrangerVille Mystery</p><p><strong>Career:</strong> Military</p><p><strong>Home:</strong> StrangerVille until the mystery is solved</p><p>Randomize favorite color and décor style. Noble privilege does not exempt this heir from personally investigating what is happening in town.</p></div>\n<h3>Investigate</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Meet locals, observe strange behavior, gather evidence, assemble the Secret Dossier, and obtain lab access.</span></label>\n<h3>Survive</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore deeper lab areas, protect against spores, develop the vaccine, and recruit allies.</span></label>\n<h3>Save the Town</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Confront and defeat the Mother Plant.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Advance substantially in the Military career while solving the mystery.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>This Head neglects noble duties while investigating. Allow Prestige/Unity consequences if they occur.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Defeating the Mother Plant becomes the Sim&#x27;s redemption and contribution to the Dynasty.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Repair standing with the family after the mystery is resolved.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who longs for beaches, open water, and a community far from secret labs and noble expectations.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>StrangerVille Mystery complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Mother Plant defeated.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Military career substantially advanced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty standing repaired after the crisis.</span></label>"},"14":{"pack":"Island Living","html":"<div class=\"pill\">The People&#x27;s Noble</div>\n<p>This heir believes status is only worthwhile if it is used to improve other people&#x27;s lives. They move to Sulani and trade courtly luxury for beaches, conservation, and community.</p>\n<h3>🏝️ Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Choose Child of the Islands or Child of the Ocean</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Beach Life</p><p><strong>Career:</strong> Conservationist</p><p><strong>Home:</strong> Sulani</p><p>Randomize favorite color and décor style. Live more modestly than the previous Noble generations and let Sulani shape the home.</p></div>\n<h3>Island Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Swim, snorkel, boat, fish, attend island gatherings, and build friendships with locals.</span></label>\n<h3>Conservation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Work through the Conservationist career, clean beaches, and actively improve Sulani&#x27;s environment until visible recovery occurs.</span></label>\n<h3>Mystical Sulani</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Explore the cave, experience volcanic activity, interact with island spirits when possible, and meet a Mermaid.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Becoming a Mermaid is optional; randomize the decision if the opportunity develops naturally.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Remain Noble if already established, but live modestly and focus on service.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Replace one overly status-focused Dynasty Value with community, conservation, nature, or another fitting ideal.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use Prestige as a consequence of actions, not the main objective.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise an heir who becomes convinced that magic is real and wants to seek it directly.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Beach Life complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Conservationist progression substantial or complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Sulani environment meaningfully improved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Island culture and mystical objectives experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty Value shifted toward service/nature.</span></label>"},"15":{"pack":"Realm of Magic","html":"<div class=\"pill\">The Court Sorcerer</div>\n<p>The heir follows family stories of island spirits into Glimmerbrook and discovers that magic is not metaphor. This is the generation where Dynasty power and supernatural power become intertwined.</p>\n<h3>🪄 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Occult status:</strong> Start Human</p><p><strong>Traits:</strong> Randomize traits not inherited from Generation 14</p><p><strong>Aspiration:</strong> Randomly choose Spellcraft & Sorcery or Purveyor of Potions</p><p><strong>Home:</strong> Glimmerbrook</p><p><strong>Primary focus:</strong> Spellcaster progression, spells, potions, and dueling</p><p>Randomize favorite color and décor style. Become a Spellcaster through gameplay after entering the Magic Realm.</p></div>\n<h3>Enter the Realm</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Discover the portal, enter the Magic Realm, meet the Sages, and become a Spellcaster legitimately.</span></label>\n<h3>Magical Education</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Increase Spellcaster rank, learn spells from several schools, learn potion recipes, and practice magic regularly.</span></label>\n<h3>Equipment &amp; Dueling</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Own a wand, broom, and familiar.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Participate in magical duels and win at least one meaningful duel.</span></label>\n<h3>Consequences</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience at least one Curse and remove it without cheats.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Develop Swordsmanship and win at least one sword duel if the Royalty &amp; Legacy skill/system is available in your save.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Own a ceremonial sword.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Create a restricted magical chamber in the Dynasty Estate for wands, tomes, potions, and magical heirlooms.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Only the Head, Heir, and magical relatives should normally use the chamber.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who respects magic but wants a conventional education and proof of achievement.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Chosen magic aspiration complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>High Spellcaster rank.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Wand, broom, familiar, spells, potions, and dueling experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least one Curse survived and removed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Swordsmanship/ceremonial sword objective complete when available.</span></label>"},"16":{"pack":"Discover University","html":"<div class=\"pill\">The Educated Aristocrat</div>\n<p>This heir grows up with privilege, magic, and a famous family history, but they want an accomplishment that cannot simply be inherited: a degree earned the hard way.</p>\n<h3>🎓 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Ambitious</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Choose an academic aspiration that fits the heir</p><p><strong>Education:</strong> Apply to university normally</p><p><strong>Starting rule:</strong> Live in student housing for at least one term</p><p>Randomize favorite color and décor style. Choose the degree based on the Sim's interests rather than whichever route is easiest.</p></div>\n<h3>Admissions</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Apply normally and choose a program from the offers actually received.</span></label>\n<h3>Campus Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Live in student housing for at least one term, join an organization, attend campus events, make friends, and develop at least one meaningful roommate relationship or conflict.</span></label>\n<h3>Academics</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Attend classes, complete homework, submit papers/presentations, and aim for an A average.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>If a class is failed, accept it instead of reloading.</span></label>\n<h3>Graduation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Graduate, display the diploma, and enter a related career.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The Dynasty&#x27;s Prestige cannot substitute for grades. This generation must earn its academic standing legitimately.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Allow family disappointment if the heir performs poorly; do not erase failure.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve the diploma in the Dynasty Estate.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise an heir increasingly concerned about the environmental cost of the family&#x27;s wealth and property.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Academic aspiration substantially or fully complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>University degree earned without cheats.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Student housing and organization experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Diploma displayed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Degree-related career entered.</span></label>"},"17":{"pack":"Eco Lifestyle","html":"<div class=\"pill\">The Reformist</div>\n<p>The educated heir returns home and sees a wealthy Dynasty consuming resources while poorer neighborhoods struggle. They decide inherited power comes with environmental responsibility.</p>\n<h3>♻️ Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Choose Green Fiend, Maker, or Recycle Disciple</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Eco Innovator or Master Maker</p><p><strong>Home:</strong> Begin in a rougher area of Evergreen Harbor</p><p><strong>Primary focus:</strong> Fabrication, recycling, NAPs, and neighborhood improvement</p><p>Randomize favorite color and décor style. Start rough enough that the environmental transformation is visible over the generation.</p></div>\n<h3>Start Rough</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Move into a less glamorous area and do not instantly replace it with a perfect eco mansion.</span></label>\n<h3>Reduce &amp; Make</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Dumpster dive, recycle, fabricate furniture, make candles, repair/reuse items, and produce useful objects yourself.</span></label>\n<h3>Community</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Vote on Neighborhood Action Plans, use Community Spaces, and participate in local decision-making.</span></label>\n<h3>Green Transformation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Move the neighborhood toward a Green Eco Footprint through actual gameplay.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Add solar/wind power, water collection, gardening, and try living partially or fully off-grid for a period.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Renovate part of the ancestral Dynasty Estate with sustainable technology.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Allow conflict with older relatives if the Head&#x27;s reforms clash with traditional family values.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>A serious conflict may create an Outcast or future rival branch if the story naturally develops.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child fascinated by travel beyond the planet and eager to escape family arguments entirely.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Eco/Maker aspiration complete or substantially progressed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Fabrication highly developed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>NAP/community systems used.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Neighborhood moved to Green footprint.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty Estate receives a sustainable renovation.</span></label>"},"18":{"pack":"Journey to Batuu","html":"<div class=\"pill\">The Wandering Heir</div>\n<p>Born into centuries of family expectation, this heir decides the most reasonable response is to leave the planet. Batuu becomes a test of whether the Dynasty survives an heir who refuses to stay close to home.</p>\n<h3>🚀 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Traits:</strong> Randomize any traits not inherited from Generation 17</p><p><strong>Faction:</strong> Randomly choose Resistance, First Order, or Scoundrel</p><p><strong>Primary destination:</strong> Batuu</p><p><strong>Rule:</strong> Commit to the faction result rather than switching because another route looks easier</p><p><strong>Dynasty responsibility:</strong> Designate an heir before a prolonged absence</p><p>Randomize favorite color and décor style for the heir's home back in the normal worlds. Their Batuu choices should be driven by the faction roll.</p></div>\n<h3>Faction Story</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Complete missions and build reputation with the randomized faction.</span></label>\n<h3>Explore Batuu</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Visit each district, spend time at Oga&#x27;s Cantina, play Sabacc, and meet major local/faction characters.</span></label>\n<h3>Droid &amp; Lightsaber</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Acquire/customize a Droid, obtain a Lightsaber, practice, duel, and bring both home as permanent family artifacts.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Before departure, the current Head formally designates this Sim as Heir.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use the long absence to begin the first serious Dynasty Rivalry: another prestigious family believes your line has become irresponsible or weak.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Returning with completed faction achievements and artifacts restores confidence.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise or prepare an heir who wants to prove themselves physically on Earth rather than through interstellar adventure.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Chosen faction storyline substantially complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>High faction reputation achieved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>All Batuu districts experienced.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Droid and Lightsaber obtained and added to the Dynasty Collection.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Rival Dynasty established.</span></label>"},"19":{"pack":"Snowy Escape","html":"<div class=\"pill\">The Worthy Heir</div>\n<p>The next heir does not want political validation. They want a challenge that nobody can inherit for them: reaching the summit of Mt. Komorebi.</p>\n<h3>🏔️ Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Adventurous</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Mt. Komorebi Sightseer, followed by Extreme Sports Enthusiast</p><p><strong>Home:</strong> Mt. Komorebi or a household that spends substantial time there</p><p><strong>Primary focus:</strong> Climbing, skiing, snowboarding, hiking, and the summit</p><p>Randomize favorite color and décor style. This heir is trying to prove they are worthy through action rather than family reputation.</p></div>\n<h3>Local Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Experience festivals, local foods, hot springs, hiking, and the major neighborhoods.</span></label>\n<h3>Extreme Sports</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Develop Skiing or Snowboarding significantly and train Rock Climbing.</span></label>\n<h3>The Expedition</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Prepare supplies, assemble a group, attempt the climb, and eventually reach the summit.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Take a family photograph at the summit.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Reaching the summit becomes an optional Dynasty rite of passage for future ambitious heirs.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Display the summit photograph prominently near Dynasty portraits.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use the achievement to strengthen the heir&#x27;s standing if previous generations created doubt about succession.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child fascinated by buildings, rooms, aesthetics, and how generations leave marks on a home.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Sightseer and Extreme Sports objectives substantially complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Rock Climbing developed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Ski/Snowboard developed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Summit reached.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Summit portrait added to Dynasty Estate.</span></label>"},"20":{"pack":"Dream Home Decorator","html":"<div class=\"pill\">Rebuilding the Estate</div>\n<p>This heir sees the ancestral estate as a living history rather than a museum. They become an interior designer and begin carefully modernizing centuries of accumulated family taste.</p>\n<h3>🎨 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Creative</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Career:</strong> Interior Decorator</p><p><strong>Primary challenge:</strong> Client renovations followed by the ancestral estate renovation</p><p><strong>Decor rule:</strong> Use the randomized favorite color and décor style in the heir's own home</p><p><strong>Estate rule:</strong> Never bulldoze the ancestral estate</p><p>Use the Random Sim Generator for any non-required traits and favorites. The challenge is to modernize history without erasing it.</p></div>\n<h3>Client Work</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Accompany the Sim on gigs, learn client preferences, complete room renovations, larger renovations, commercial work, and major projects as available.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Do not deliberately ignore client preferences because your personal taste differs.</span></label>\n<h3>Professional Reputation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Build a strong reputation and progress deeply through the career.</span></label>\n<h3>Estate Renovation</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Renovate the ancestral estate section by section.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve the portrait gallery, crest, heirloom room, and at least one genuinely old room/object.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Let this Head&#x27;s random style influence the new additions instead of homogenizing the mansion.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Treat the estate as a timeline: do not erase all evidence of previous generations.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Create labels or themed rooms for major eras if you enjoy museum-style storytelling.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Preserve at least one before/after photograph from this Head&#x27;s career.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise a child who appreciates beautiful interiors but wants land, animals, and a simpler rural life.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Interior Decorator career strongly progressed or maxed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Multiple gig types completed.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty Estate renovated without bulldozing.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Historic spaces and heirlooms preserved.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Favorite color/decor incorporated.</span></label>"},"21":{"pack":"Cottage Living","html":"<div class=\"pill\">The Noble Who Walked Away</div>\n<p>This heir voluntarily walks away from luxury. They remain part of the Dynasty, but they want to prove the family name does not make them better than the villagers of Henford-on-Bagley.</p>\n<h3>🐄 Starting Your Adult Life</h3>\n<div class=\"start-card\"><p><strong>Life stage:</strong> Young Adult</p><p><strong>Required trait:</strong> Animal Enthusiast</p><p><strong>Other 2 traits:</strong> Randomize them</p><p><strong>Aspiration:</strong> Country Caretaker</p><p><strong>Home:</strong> Henford-on-Bagley</p><p><strong>Lot challenge:</strong> Simple Living</p><p>Randomize favorite color and décor style. Leave the luxury estate behind and build a practical country home around farming and animals.</p></div>\n<h3>Farm Animals</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise chickens and own a cow or llama.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Befriend animals and interact with wild rabbits and birds.</span></label>\n<h3>Food &amp; Farming</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Grow crops and Oversized Crops, cook with ingredients produced on the lot, and make preserves.</span></label>\n<h3>Village Life</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Run errands, shop locally, meet villagers, and participate in community life.</span></label>\n<h3>Finchwick Fair</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Enter multiple fair competitions and win at least one.</span></label>\n<h3>Dynasty Integration</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>The Head remains Dynasty leader but refuses to live at the main estate.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Build Prestige through community relationships rather than courtly display.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Host at least one Dynasty visit at the farm so elite relatives must experience the heir&#x27;s chosen lifestyle.</span></label>\n<h3>The Next Heir</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Raise an heir surrounded by cozy traditions who becomes intensely romantic and dreams of a spectacular wedding.</span></label>\n<h3>Generation Completion Checklist</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Country Caretaker complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Simple Living used throughout the generation.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Major farm animal and crop goals complete.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>At least one Finchwick competition won.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Dynasty farm visit held.</span></label>\n<h3>Optional Stuff Pack / Kit Side Objectives</h3>\n<label class=\"task\"><input type=\"checkbox\"><span>Use Laundry Day as part of household routine.</span></label>\n<label class=\"task\"><input type=\"checkbox\"><span>Use Country Kitchen / Cottage-style Build/Buy content you own to reinforce the homestead theme.</span></label>"},"22":{"pack":"My Wedding Stories","html":"<div class=\"pill\">The Royal Wedding</div>\n<p>After a deliberately simple rural generation, the next heir swings in the opposite direction. Romance, ceremony, alliances, family expectations, and a wedding worthy of the Dynasty become the center of life
